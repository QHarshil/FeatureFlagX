spring:
  main:
    allow-bean-definition-overriding: true  # ✅ Added line — fixes duplicate redisTemplate issue

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Disable Redis autoconfiguration for tests (since TestRedisConfiguration provides its own)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging:
  level:
    com.featureflagx: DEBUG
