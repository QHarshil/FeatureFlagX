spring:
  main:
    allow-bean-definition-overriding: true  # Prevent bean conflicts (e.g., redisTemplate)
    banner-mode: "off"  # Optional: cleaner CI logs

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Completely disable Redis in test profile
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Optional flag you can read in RedisConfig to skip bean creation
featureflagx:
  redis:
    enabled: false

logging:
  level:
    com.featureflagx: DEBUG
