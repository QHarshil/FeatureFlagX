name: FeatureFlagX CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-package:
    name: 🧱 Build & Test Spring Boot API
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: ⚙️ Build and Run Tests
      working-directory: ./api
      run: mvn -B clean verify --file pom.xml

    - name: 📦 Package Application JAR
      working-directory: ./api
      run: mvn -B package -DskipTests --file pom.xml

    - name: 🧾 Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: featureflagx-api-jar
        path: api/target/*.jar

  docker-build-and-push:
    name: 🐳 Build, Test & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test-package
    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout Repository
      uses: actions/checkout@v4

    - name: 🧱 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🧩 Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: 🐳 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 🏗️ Build Docker Image
      working-directory: ./api
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/featureflagx-api:latest \
                     -t ${{ secrets.DOCKERHUB_USERNAME }}/featureflagx-api:${{ github.sha }} .

    - name: ✅ Smoke Test Docker Container
      run: |
        docker run -d -p 8080:8080 --name featureflagx-test ${{ secrets.DOCKERHUB_USERNAME }}/featureflagx-api:latest
        echo "⏳ Waiting for app startup..."
        sleep 25
        echo "🔍 Checking health endpoint..."
        curl --fail http://localhost:8080/actuator/health
        docker stop featureflagx-test
        docker rm featureflagx-test

    - name: 🚀 Push Docker Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/featureflagx-api:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/featureflagx-api:${{ github.sha }}

    - name: 🧹 Cleanup Build Cache
      if: always()
      run: docker builder prune -f
